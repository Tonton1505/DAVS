# ============================================================================
# DAVS Vietnamese Error & UI Messages (messages_vi.properties)
# Source of truth: context.md Appendix A (SRS section 2.7)
# ============================================================================
app.name=DAVS – Hệ thống Phân tích và Trực quan hóa dữ liệu

ERR-AUTH-01=Email hoặc mật khẩu không đúng. Vui lòng kiểm tra lại.
ERR-AUTH-02=Bạn cần đồng ý điều khoản sử dụng để kích hoạt tài khoản.
ERR-AUTH-03=Tài khoản tạm khóa 15 phút do đăng nhập sai nhiều lần.
ERR-AUTH-04=Tài khoản của bạn không có giấy phép hợp lệ. Vui lòng liên hệ quản trị viên.
ERR-AUTH-05=Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại.

ERR-USR-01=Tên tài khoản "{x}" không hợp lệ.
ERR-USR-02=Tài khoản "{x}" đã tồn tại.
ERR-USR-03=Tệp không đúng mẫu hoặc có {n} dòng lỗi. Tải báo cáo lỗi để xem chi tiết.
ERR-USR-04=Số giấy phép vai trò "{r}" đã hết. Không thể thêm hoặc nâng vai trò.
ERR-USR-05=Vui lòng chọn người nhận quyền sở hữu nội dung trước khi xóa.
ERR-USR-06=Vai trò của người dùng không đủ để sở hữu nội dung này.

ERR-GRP-01=Tên nhóm là bắt buộc và không được trùng với nhóm khác.

ERR-PRJ-01=Tên đã tồn tại trong thư mục này. Vui lòng chọn tên khác.
ERR-PRJ-02=Tên gồm 1–128 ký tự và không chứa / \\ : * ? " < > |.
ERR-PRJ-03=Bạn không có quyền thực hiện thao tác này.
ERR-PRJ-04=Chỉ hỗ trợ tệp .twb hoặc .twbx.
ERR-PRJ-05=Tệp vượt dung lượng tối đa {n} MB.
ERR-PRJ-06=Workbook cùng tên đã tồn tại. Bạn muốn ghi đè hay đổi tên?
ERR-PRJ-07=Giá trị nhãn đã tồn tại trong danh mục này.
ERR-PRJ-08=Tệp bị từ chối vì không vượt qua kiểm tra an toàn.
ERR-PRJ-09=Phiên bản này đã bị xóa do vượt giới hạn lưu trữ.

ERR-DAT-01=Không thể kết nối tới nguồn dữ liệu. Kiểm tra máy chủ, tên CSDL, tài khoản và mật khẩu.
ERR-DAT-02=Chưa cài driver cho loại cơ sở dữ liệu này. Tải driver tại liên kết bên dưới.
ERR-DAT-03=Tài khoản kết nối sai hoặc không đủ quyền đọc dữ liệu.
ERR-DAT-04=Không đọc được tệp dữ liệu. Tệp có thể bị hỏng hoặc sai định dạng.
ERR-DAT-05=Làm mới dữ liệu thất bại. Dữ liệu trước đó được giữ nguyên.
ERR-DAT-06=Hai trường quan hệ khác kiểu dữ liệu. Hãy đổi kiểu hoặc chọn trường khác.

ERR-VIZ-01=Công thức sai cú pháp tại vị trí {n}.
ERR-VIZ-02=Giá trị nằm ngoài phạm vi cho phép của tham số.
ERR-VIZ-03=Trường "{x}" không tồn tại trong nguồn dữ liệu.
ERR-VIZ-04=Biểu đồ có hơn 100.000 điểm và có thể chậm. Hãy lọc hoặc tổng hợp dữ liệu.
ERR-VIZ-05=Tên đã được sử dụng. Vui lòng chọn tên khác.
ERR-VIZ-06=Công thức tham chiếu vòng tròn đến chính nó.
ERR-VIZ-07=Sheet nguồn và đích không hợp lệ hoặc không có trường chung.

ERR-PUB-01=Không thể xuất bản: thiếu quyền, vượt dung lượng hoặc hết giấy phép.
ERR-PUB-02=Workbook đã tồn tại. Chọn ghi đè (tạo phiên bản mới) hoặc đổi tên.
ERR-PUB-03=Không kết nối được nguồn dữ liệu nhúng. Kiểm tra thông tin xác thực.

ERR-SHR-01=Không tìm thấy người nhận "{x}".
ERR-SHR-02=Chính sách không cho phép chia sẻ cho người ngoài tổ chức.

ERR-EXP-01=Dữ liệu vượt giới hạn xuất. Hãy dùng bộ lọc để giảm dữ liệu.
ERR-EXP-02=Quá thời gian tạo tệp. Hãy thu hẹp bộ lọc và thử lại.

ERR-CMT-01=Bình luận phải từ 1 đến 1.000 ký tự.

ERR-INT-01=Kết nối với {nền tảng} không thành công. Vui lòng thử lại.
ERR-INT-02=Tên miền hoặc URL không hợp lệ.
ERR-INT-03=Tên ứng dụng kết nối đã tồn tại.

ERR-SYS-01=Hệ thống gặp sự cố. Vui lòng thử lại sau hoặc liên hệ hỗ trợ (mã: {id}).
